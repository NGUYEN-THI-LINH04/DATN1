<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}Tài khoản | Mộc Hán{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/common.css') }}">
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>
    <main class="auth-layout">
        <section class="auth-visual">
            <a class="auth-brand" href="{{ url_for('home.index') }}">
                学 Mộc Hán
            </a>

            <div>
                <span class="eyebrow">MỘT HÀNH TRÌNH MỚI</span>
                <h2>Thêm một từ mới.<br>Thêm một thế giới.</h2>
                <p>Học tiếng Trung theo nhịp của riêng bạn.</p>
            </div>

            <img
                src="{{ url_for('static', filename='images/courses/chinese-landscape.svg') }}"
                alt="Phong cảnh Trung Hoa"
            >
        </section>

        <section class="auth-content">
            <div class="auth-box">
                <a class="auth-back" href="{{ url_for('home.index') }}">
                    ← Về trang chủ
                </a>

                {% block content %}{% endblock %}
            </div>
        </section>
    </main>

    <script>
    document.querySelectorAll("form[data-preview-form]").forEach(function (form) {
        form.addEventListener("submit", function (event) {
            event.preventDefault();

            const password = form.querySelector("[name=password]");
            const confirmPassword = form.querySelector("[name=confirm]");
            const message = form.querySelector("[role=status]");

            if (
                password &&
                confirmPassword &&
                password.value !== confirmPassword.value
            ) {
                message.textContent = "Hai mật khẩu chưa khớp.";
                return;
            }

            message.textContent = form.dataset.message;
        });
    });
    </script>

    {% block extra_js %}{% endblock %}
</body>
</html>
