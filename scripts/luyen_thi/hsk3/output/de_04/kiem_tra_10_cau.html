
<!DOCTYPE html>
<html lang="vi">

<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width,initial-scale=1"
>

<title>HSK3 Đề 4 - H31004</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 24px;
    background: #f3f5f9;
    color: #1e293b;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 1000px;
    margin: auto;
}

h1 {
    font-size: 25px;
}

p {
    color: #64748b;
    line-height: 1.6;
}

.card {
    background: white;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    padding: 20px;
    margin-top: 20px;
}

.card h2 {
    font-size: 19px;
}

.card img {
    display: block;
    width: 100%;
    height: auto;
    object-fit: contain;
    max-width: 750px;
    margin: auto;
}

.numbers {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 20px;
}

.number {
    padding: 10px 14px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-weight: bold;
}
</style>

</head>

<body>
<div class="container">

<h1>HSK3 – Đề 4 (H31004)</h1>

<p>
Kiểm tra hai bảng hình câu 1–10.
Không hiển thị đáp án.
Chưa thay đổi SQL Server.
</p>


<section class="card">
    <h2>Câu 1–5</h2>

    <img
        src="groups/nghe_01_05.png"
        alt="Bảng hình câu 1-5"
    >

    <div class="numbers">
        <span class="number">Câu 1</span><span class="number">Câu 2</span><span class="number">Câu 3</span><span class="number">Câu 4</span><span class="number">Câu 5</span>
    </div>
</section>


<section class="card">
    <h2>Câu 6–10</h2>

    <img
        src="groups/nghe_06_10.png"
        alt="Bảng hình câu 6-10"
    >

    <div class="numbers">
        <span class="number">Câu 6</span><span class="number">Câu 7</span><span class="number">Câu 8</span><span class="number">Câu 9</span><span class="number">Câu 10</span>
    </div>
</section>


</div>
</body>
</html>
