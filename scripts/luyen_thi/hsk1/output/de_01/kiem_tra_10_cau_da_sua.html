<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>HSK1 - Kiểm tra ảnh đã sửa</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:25px;background:#faf1e5;font-family:Arial,sans-serif}
main{max-width:1050px;margin:auto}
h1{font-size:26px}
h2{font-size:19px;margin-top:30px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{border:2px solid #333;background:#fffaf3;border-radius:10px;padding:15px}
.card strong{display:block;margin-bottom:12px}
.image{background:white;display:flex;align-items:center;justify-content:center;min-height:140px;padding:10px}
.image img{max-width:100%;height:auto;object-fit:contain}
@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body><main>
